# ---- Gradle ----
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---- Minecraft / Fabric (26.1.2 でビルド。26.1 サーバーでも動く想定) ----
# 26.1 ちょうどのサーバーで不具合が出た場合は、下の2行を
#   minecraft_version=26.1
#   fabric_api_version=0.145.1+26.1
# に変えてビルドし直してください。
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.155.3+26.1.2

# ---- Polymer (バニラクライアント向けのサーバーサイドアイテム用) ----
polymer_version=0.16.5+26.1.2

# ---- この MOD ----
mod_version=1.0.0
maven_group=com.dbzserver
archives_base_name=dbzmod
