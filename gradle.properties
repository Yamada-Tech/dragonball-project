# ---- Gradle ----
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---- ビルド対象の Minecraft バージョン (標準は 26.3) ----
# 別のバージョン用にビルドしたいときは、この4行を下の表の値に書き換えます。
# (GitHub Actions では、26.3 用と 26.1.2 用の両方を自動でビルドします)
#
#   対象      minecraft_version  fabric_api_version   polymer_version   minecraft_dep
#   26.3      26.3               0.161.0+26.3         0.18.2+26.3       ~26.3
#   26.1.2    26.1.2             0.155.3+26.1.2       0.16.5+26.1.2     ~26.1
minecraft_version=26.3
fabric_api_version=0.161.0+26.3
polymer_version=0.18.2+26.3
minecraft_dep=~26.3

loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# ---- この MOD ----
mod_version=1.0.0
maven_group=com.dbzserver
archives_base_name=dbzmod
