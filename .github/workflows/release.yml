name: release

# GitHub の「Releases」画面でリリースを「公開 (Publish)」すると動きます。
# MOD の jar (26.3 用・26.1.2 用) とリソースパックを、そのリリースに自動で添付します。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mod:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.3"
            fabric_api: "0.161.0+26.3"
            polymer: "0.18.2+26.3"
            dep: "~26.3"
          - mc: "26.1.2"
            fabric_api: "0.155.3+26.1.2"
            polymer: "0.16.5+26.1.2"
            dep: "~26.1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod (Minecraft ${{ matrix.mc }})
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace \
            "-Pminecraft_version=${{ matrix.mc }}" \
            "-Pfabric_api_version=${{ matrix.fabric_api }}" \
            "-Ppolymer_version=${{ matrix.polymer }}" \
            "-Pminecraft_dep=${{ matrix.dep }}"
          rm -f build/libs/*-sources.jar

      - name: Attach jar to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: build/libs/dbzmod-*.jar

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip resource pack and write notes
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd resourcepack
          zip -r -X ../dbzmod-resourcepack.zip .
          cd ..
          SHA1=$(sha1sum dbzmod-resourcepack.zip | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/dbzmod-resourcepack.zip"
          {
            echo "## server.properties に設定する値"
            echo
            echo '```properties'
            echo "resource-pack=${URL}"
            echo "resource-pack-sha1=${SHA1}"
            echo "require-resource-pack=true"
            echo '```'
            echo
            echo "## 入れる jar"
            echo
            echo "- Minecraft 26.3 のサーバー: \`dbzmod-*-mc26.3.jar\` + Polymer \`0.18.2+26.3\`"
            echo "- Minecraft 26.1 / 26.1.2 のサーバー: \`dbzmod-*-mc26.1.2.jar\` + Polymer \`0.16.5+26.1.2\`"
          } > release-notes.md
          cat release-notes.md

      - name: Attach resource pack and notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: release-notes.md
          files: dbzmod-resourcepack.zip
