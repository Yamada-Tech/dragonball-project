name: release

# 「v1.0.0」のようなタグを打つと、MOD の jar とリソースパックをリリースに添付します。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Zip resource pack and write notes
        run: |
          cd resourcepack
          zip -r -X ../dbzmod-resourcepack.zip .
          cd ..
          SHA1=$(sha1sum dbzmod-resourcepack.zip | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/dbzmod-resourcepack.zip"
          {
            echo "## server.properties に設定する値"
            echo
            echo '```properties'
            echo "resource-pack=${URL}"
            echo "resource-pack-sha1=${SHA1}"
            echo "require-resource-pack=true"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dbzmod-resourcepack.zip
            build/libs/dbzmod-*.jar
