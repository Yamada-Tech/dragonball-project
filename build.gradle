plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// jar 名に Minecraft のバージョンを入れる (例: dbzmod-1.0.0-mc26.3.jar)
version = project.mod_version + "-mc" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Polymer の配布先
	maven { url = 'https://maven.nucleoid.xyz' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Polymer はコンパイル時のみ参照。実行時はサーバーの mods フォルダに
	// Polymer 本体 (polymer-bundled) を別途入れてください。
	implementation "eu.pb4:polymer-core:${project.polymer_version}"
	implementation "eu.pb4:polymer-common:${project.polymer_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dep", project.minecraft_dep

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_dep": project.minecraft_dep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name
}
